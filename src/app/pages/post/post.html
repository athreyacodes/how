<article class="post" (click)="copyCode($event)">
  <p class="kicker">
    <a routerLink="/">How</a>
    <span aria-hidden="true"> / </span>
    <span>{{ typeLabel() }}</span>
  </p>

  <h1>{{ post().title }}</h1>

  <p class="meta">
    <time [attr.datetime]="post().date">{{ post().date | date: 'd MMMM yyyy' }}</time>
    @if (post().updated !== post().date) {
      <span>Updated {{ post().updated | date: 'd MMMM yyyy' }}</span>
    }
  </p>

  <img
    class="banner"
    [ngSrc]="post().banner"
    width="1200"
    height="630"
    alt=""
    priority
  />

  @if (post().tags.length) {
    <p class="tags">
      @for (tag of post().tags; track tag) {
        <span>{{ tag }}</span>
      }
    </p>
  }

  <div class="body" [innerHTML]="html()"></div>
</article>
